<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCF · Avaliação de Árbitros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --verde:#0b3b24;--verde2:#145a38;--amarelo:#f5b800;--cinza:#f3f4f3;--linha:#dfe3e0;--texto:#1d2420;--sub:#5d6862;
  --navy:#0a0f3c;--navy2:#0d1233;--azul:#1225c9;--neon:#5b8cff;--laranja:#f07a2c;--ouro:#f5d000;--ok:#4be38a;--alerta:#ff8a4c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Barlow,Arial,Helvetica,sans-serif;color:var(--texto);background:#fff}
button,input,select,textarea{font:inherit}
.faixa{height:4px;background:var(--amarelo)}
.topo{background:var(--cinza);display:flex;justify-content:space-between;align-items:center;padding:8px max(16px,calc((100% - 1180px)/2));font-size:14px}
.topo nav{display:flex;gap:22px}.topo a{color:var(--texto);text-decoration:none}
.redes{display:flex;gap:6px}.redes span{width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.cab{display:flex;min-height:118px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);position:relative;z-index:2}
.logo{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 24px 0 max(16px,calc((100% - 1180px)/2))}
.logoimg{height:82px;width:auto;max-width:100%;display:block}
.logo .selo{width:62px;height:78px;border:2px solid var(--verde);border-radius:0 0 26px 26px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;color:var(--verde);font-size:20px}
.logo .txt{font-family:'Barlow Condensed';color:var(--verde2);line-height:1;font-size:17px;letter-spacing:.5px}
.logo .txt b{display:block;font-size:22px;color:var(--verde)}
.menu{flex:1;min-width:0;background:var(--verde);clip-path:polygon(78px 0,100% 0,100% 100%,0 100%);display:flex;justify-content:flex-end;align-items:stretch;padding-right:max(16px,calc((100% - 1180px)/2))}
.menu button{background:none;border:0;color:#fff;cursor:pointer;padding:0 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:17px;letter-spacing:.3px;border-bottom:4px solid transparent}
.menu button svg{width:34px;height:34px;fill:#fff}
.menu button[aria-selected=true]{border-bottom-color:var(--amarelo)}
.menu button:focus-visible{outline:2px solid var(--amarelo);outline-offset:-4px}
.tela{display:none}.tela.ativa{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:36px 16px 60px}
.chapeu{font-size:12px;font-weight:700;color:var(--verde);display:flex;gap:6px;align-items:center}
.chapeu::before{content:"";border-left:6px solid #d9262c;border-top:4px solid transparent;border-bottom:4px solid transparent}
h1{font-size:34px;font-weight:500;color:var(--verde);margin:4px 0 22px}
.card{border:1px solid var(--linha);border-top:4px solid var(--verde);background:#fff;padding:22px;margin-bottom:18px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label.c{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--sub)}
input,select,textarea{border:1px solid #c9cfcb;border-radius:4px;padding:9px 10px;color:var(--texto);background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amarelo);border-color:var(--verde)}
details.bloco{border:1px solid var(--linha);margin-bottom:12px;background:#fff}
details.bloco summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:var(--verde);color:#fff;font-size:19px;font-weight:600}
details.bloco summary::-webkit-details-marker{display:none}
.nb{background:var(--amarelo);color:var(--verde);border-radius:4px;padding:3px 10px;font-size:15px;min-width:92px;text-align:center}
.item{padding:16px 20px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .q{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:10px}
.item .q .peso{flex:0 0 auto;font-size:12px;color:var(--verde);background:#e7f0ea;border-radius:4px;padding:2px 8px;height:fit-content}
.item.cg{background:#fffbea}
.item.cg .q::after{content:"Conceito geral";font-size:11px;color:#8a6a00;background:#ffeeb0;border-radius:4px;padding:2px 8px;height:fit-content;order:-1}
.dica{font-size:13px;color:var(--sub);margin:-4px 0 10px}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.ops label{position:relative}
.ops input{position:absolute;opacity:0;width:1px;height:1px}
.ops span{display:block;border:1px solid #c9cfcb;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;background:#fff}
.ops input:checked+span{background:var(--verde);border-color:var(--verde);color:#fff}
.ops input.na:checked+span{background:#6b7570;border-color:#6b7570}
.ops input:focus-visible+span{outline:2px solid var(--amarelo)}
.min{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.min input{font-size:13px;padding:7px 9px}
.acoes{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.btn{background:var(--amarelo);color:var(--verde);border:0;border-radius:4px;padding:12px 28px;font-weight:700;font-size:16px;cursor:pointer}
.btn.sec{background:#fff;border:1px solid var(--verde)}
.erro{color:#b3261e;font-size:14px}
.rod{background:var(--verde);color:#dfe9e3;font-size:13px;text-align:center;padding:18px 16px}

/* ===== DASHBOARD ===== */
#dash{background:var(--navy);color:#fff;font-family:'Barlow Condensed',Barlow,sans-serif}
.db{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 170px)}
.side{background:var(--navy2);padding:26px 18px;display:flex;flex-direction:column;gap:18px}
.side .marca{align-self:center;text-align:center;border:2px solid var(--neon);border-radius:8px;padding:10px 16px;font-size:22px;font-weight:700;letter-spacing:1px}
.side .marca small{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;color:#cdd6ff}
.side label{font-size:17px;display:flex;flex-direction:column;gap:6px}
.side select,.side input{background:var(--navy);color:#fff;border:1px solid #5a67b8;border-radius:2px}
.main{background:var(--azul);padding:26px;display:grid;gap:18px;align-content:start}
.gl{background:var(--navy);border:2px solid var(--neon);border-radius:14px;box-shadow:0 0 14px rgba(91,140,255,.55)}
.perfil{display:grid;grid-template-columns:180px 1fr 150px;gap:18px}
.foto{width:180px;height:210px;background:#e4e6ee;border-radius:4px;overflow:hidden;position:relative;cursor:pointer;display:grid;place-items:center;color:#445;font-size:48px;font-weight:700;border:0;padding:0}
.foto img{width:100%;height:100%;object-fit:cover}
.foto::after{content:"Trocar foto";position:absolute;bottom:0;left:0;right:0;background:rgba(10,15,60,.8);color:#fff;font-size:13px;padding:5px;opacity:0;transition:opacity .2s}
.foto:hover::after,.foto:focus-visible::after{opacity:1}
.col{display:grid;gap:9px;align-content:start}
.barra{background:var(--navy);border:2px solid #3a4ab0;border-radius:4px;text-align:center;padding:8px;font-size:24px;font-weight:600}
.lar{background:var(--laranja);border-radius:10px;text-align:center;padding:6px 10px;font-size:20px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chips .lar{font-size:17px;line-height:1.25}
.rank{border:4px solid var(--ouro);border-radius:18px;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px}
.rank b{font-size:64px;color:var(--ouro);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.kpi{text-align:center;padding:12px}.kpi .k{font-size:18px;color:#cdd6ff}.kpi .v{font-size:40px;font-weight:700;line-height:1.1}
.baixo{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.radar{padding:16px;height:430px}
.dir{display:grid;gap:18px;align-content:start}
.dist{padding:14px;text-align:center}
.dist .t{font-size:18px;margin-bottom:8px}
.dist .g{display:grid;grid-template-columns:repeat(5,1fr)}
.dist .g div{border-left:1px solid #2a3688}.dist .g div:first-child{border:0}
.dist .k{font-size:14px;color:#cdd6ff}.dist .v{font-size:26px;font-weight:700}
.dest{padding:14px;text-align:center;border-color:var(--ouro);box-shadow:0 0 14px rgba(245,208,0,.45)}
.dest .k{font-size:15px;color:#cdd6ff}.dest .v{font-size:24px;font-weight:700}
.coment{padding:14px;font-family:Barlow,sans-serif;font-size:14px;line-height:1.5;max-height:190px;overflow:auto}
.coment h3{font-family:'Barlow Condensed';font-size:18px;font-weight:600;margin:0 0 6px;text-align:center}
.coment p{margin:0 0 8px;color:#dfe5ff}
.vazio{padding:60px 20px;text-align:center;font-size:22px}
@media (max-width:980px){
  .db{grid-template-columns:1fr}.perfil{grid-template-columns:1fr 1fr}.perfil .col{grid-column:1/-1;order:3}
  .baixo{grid-template-columns:1fr}.kpis{gap:10px}.kpi .v{font-size:30px}
  .side{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.side .marca{display:none}.side label{font-size:15px}#btnReset{grid-column:1/-1}
  .main{padding:16px}.radar{height:340px}
  .cab{min-height:92px}.logo{padding:0 10px 0 12px}.logoimg{height:60px}
  .menu{clip-path:polygon(44px 0,100% 0,100% 100%,0 100%);padding-left:44px}
  .menu button{padding:0 14px;font-size:15px;gap:6px}.menu button svg{width:28px;height:28px}.logo .txt{display:none}.topo nav{gap:12px;font-size:13px}
}
@media (max-width:560px){.cab{min-height:76px}.logoimg{height:46px}.menu{clip-path:polygon(30px 0,100% 0,100% 100%,0 100%);padding-left:30px}.menu button{padding:0 10px;font-size:13px}.menu button svg{width:24px;height:24px}h1{font-size:28px}.item .q{flex-wrap:wrap}.wrap{padding:24px 12px 48px}.card{padding:16px}.item{padding:14px}.foto{width:100%}.min{grid-template-columns:1fr}.redes{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="faixa"></div>
<div class="topo">
  <nav><a href="#">Credenciamento</a><a href="#">TJDF-CE</a><a href="#">Canal de ética</a></nav>

</div>
<header class="cab">
  <div class="logo">
    <img src="https://www.futebolcearense.com.br/2023/assets/images/logo-fcf.png" alt="Federação Cearense de Futebol" class="logoimg"

      DASHBOARD

</header>

<!-- ===== TELA 1: FORMULÁRIO ===== -->
<section id="form" class="tela ativa">
  <div class="wrap">
    <div class="chapeu">ARBITRAGEM</div>
    <h1>Avaliação de desempenho · Árbitro</h1>
    <div class="card">
      <div class="grade">
        <label class="c">Árbitro avaliado<select id="fArb" required></select></label>
        <label class="c">Avaliador<input id="fAval" placeholder="Nome do avaliador"></label>
        <label class="c">Competição<select id="fComp"><option>Campeonato Cearense Série A</option><option>Campeonato Cearense Série B</option><option>Copa Fares Lopes</option><option>Cearense Feminino</option></select></label>
        <label class="c">Partida<input id="fJogo" placeholder="Ceará x Fortaleza"></label>
        <label class="c">Data<input id="fData" type="date"></label>
      </div>
    </div>
    <div id="blocos"></div>

      <div style="font-size:19px;font-weight:600;color:var(--verde);margin-bottom:12px">Bloco escrito</div>

        <label class="c">Resumo<textarea id="fResumo" rows="3"></textarea></label>

    </div>
  </div>
</section>

<!-- ===== TELA 2: DASHBOARD ===== -->
<section id="dash" class="tela">
  <div class="db">

      <div class="marca">FCF<small>Desenvolvimento de arbitragem</small></div>
      <label>Árbitro<select id="dArb"></select></label>

      <label>Grupo<select id="dGrupo"><option value="">Todos</option><option>A</option><option>B</option><option>C</option></select></label>

    <div class="main" id="dMain"></div>
  </div>
</section>

<footer class="rod">Federação Cearense de Futebol · CNPJ 07.036.676/0001-84 · Rua Paulino Nogueira, 77, Benfica · (85) 3206.6500</footer>

<script>
/* ---------- ESCALAS ---------- */
const E  ={ops:[['Excelente',5],['Ótimo',4],['Bom',3],['Regular',2],['Insuficiente',1]],na:'Não observado'};
const E0 ={ops:E.ops,na:null};
const EG ={ops:E.ops,na:'Não houve gol'};
const S  ={ops:[['Sempre',5],['Frequentemente',4],['Às vezes',3],['Raramente',2],['Nunca',1]],na:null};
const SN ={ops:[['Sim',5],['Às vezes',3],['Não',1]],na:'Não observado'};
const SNi={ops:[['Não',5],['Às vezes',3],['Sim',1]],na:'Não observado'};
const T22={ops:[['Todo o jogo',5],['Quase todo o jogo',4],['Do início até parte do 2T',3],['Apenas o 1T todo',2],['Apenas uma parte do 1T',1]],na:'Não observado'};
const V40={ops:[['Sim, todas',5],['Sim, algumas',3],['Sim, quase nenhuma',2],['Não',1]],na:'Não ocorreu'};

/* ---------- PERGUNTAS (slides 3 a 10) ---------- */
const BLOCOS=[
 {id:'b1',nome:'Decisões técnicas e disciplinares',curto:'Decisões',itens:[
  ['1','Conceito geral: técnicas e disciplinares',5,E,1],
  ['2','Reconhecer faltas e não faltas',4,E],
  ['3','Mãos',4,E],
  ['4','Simulações claras',2,E]]},
 {id:'b2',nome:'Controle de jogo',curto:'Controle de jogo',itens:[
  ['5','Conceito geral: controle de jogo',5,E,1],
  ['6','Possui bom entendimento da lei da vantagem?',3,SN],
  ['7','Controlar situações de reprovação com palavras ou ações',5,E],
  ['8','Controle das áreas técnicas',5,E],
  ['9','Ações preventivas',4,E],
  ['10','Controlar a distância regulamentar nos reinícios de jogo',3,E],
  ['11','Comemorações de gols',2,EG],
  ['12','Situações de retardar o reinício de jogo',3,E],
  ['13','Situações de conflitos',4,E]]},
 {id:'b3',nome:'Mental',curto:'Mental',itens:[
  ['14','Conceito geral: mental',2,E,1],
  ['15','Confiança nas tomadas de decisões',3,E],
  ['16','Linguagem corporal (gestos, postura, expressões etc.)',2,E,0,'Se transmite autoridade, segurança e comunicação eficaz. Expressões faciais, postura e gestos impactam a percepção dos jogadores e a condução do jogo.'],
  ['17','Controle emocional',3,E,0,'Capacidade de adequar o equilíbrio emocional às situações e lidar com as pressões, demonstrando segurança, autoridade e respeito.']]},
 {id:'b4',nome:'Condição física',curto:'Condição física',itens:[
  ['18','Conceito geral: condição física',4,E,1],

 {id:'b5',nome:'Leitura e posicionamento',curto:'Leitura e posic.',itens:[

 {id:'b6',nome:'Trabalho em equipe',curto:'Trab. em equipe',itens:[
  ['30','Conceito geral: trabalho em equipe',1,E,1],
  ['32','Decisões relativas à Regra 11 (trabalho em equipe)',5,E,0,'Decisões importantes e/ou interpretativas em que houve intervenção do árbitro.'],

  ['34','Infrações dentro/fora da área penal',3,E],
  ['35','Decisões de gol/não gol',3,E],
  ['35.1','Comunicação',3,E]]},
 {id:'b7',nome:'VAR',curto:'VAR',itens:[
  ['36','Conceito geral: VAR',3,E,1],
  ['37','Delay de apito',3,SNi],
  ['38','Gestual protocolar',1,E],
  ['39','Gestão de campo em situações de checagens/revisões',2,E],
  ['40','As decisões protocolares (VAR) foram bem decididas em campo?',3,V40]]}
];

/* ---------- DADOS ---------- */
const ARB_EX=[
 {id:'a1',nome:'Rafael Menezes Albuquerque',cidade:'Fortaleza',grupo:'A',idade:34,sexo:'Masculino'},
 {id:'a2',nome:'Juliana Castro Bezerra',cidade:'Juazeiro do Norte',grupo:'A',idade:31,sexo:'Feminino'},
 {id:'a3',nome:'Marcos Vinícius Holanda',cidade:'Sobral',grupo:'B',idade:39,sexo:'Masculino'},
 {id:'a4',nome:'Diego Sampaio Leitão',cidade:'Crato',grupo:'B',idade:28,sexo:'Masculino'},

const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ARB=ld('fcf_arb',null)||ARB_EX;
let AVAL=ld('fcf_aval',null);
let FOTOS=ld('fcf_fotos',{});

function exemplo(){
  let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
  const jogos=['Ceará x Fortaleza','Ferroviário x Floresta','Iguatu x Maracanã','Caucaia x Horizonte','Barbalha x Tirol','Atlético-CE x Pacajus'];

  ARB_EX.forEach(a=>{for(let n=0;n<5;n++){
    const resp={};
    BLOCOS.forEach((b,bi)=>b.itens.forEach(([id,,,esc])=>{
      if(esc.na&&r()<.06){resp[id]={na:true};return}
      let v=Math.round(base[a.id]+(bi===6?-.5:0)+(r()-.5)*1.8);v=Math.max(1,Math.min(5,v));
      const op=esc.ops.reduce((p,c)=>Math.abs(c[1]-v)<Math.abs(p[1]-v)?c:p);resp[id]={l:op[0],v:op[1]};
    }));
    out.push({arb:a.id,aval:'Avaliador exemplo',comp:comps[n%3],jogo:jogos[(n+a.id.charCodeAt(1))%6],data:`2026-0${4+n}-1${n}`,resp,
      resumo:'Boa leitura de jogo e postura firme nos momentos de pressão.',pos:'Posicionamento em lances de área, comunicação com assistentes.',mel:'Tempo de reação em situações de VAR.'});
  }});
  return out;
}
if(!AVAL){AVAL=exemplo();sv('fcf_aval',AVAL)}

/* ---------- CÁLCULO ---------- */
function notaBloco(b,resp){let s=0,m=0;b.itens.forEach(([id,,p])=>{const r=resp[id];if(r&&!r.na){s+=p*r.v;m+=p*5}});return m?s/m*10:null}
function notas(av){const nb=BLOCOS.map(b=>notaBloco(b,av.resp));const v=nb.filter(x=>x!=null);return{nb,geral:v.length?v.reduce((a,c)=>a+c,0)/v.length:null}}
const med=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
const fmt=n=>n==null?'–':n.toFixed(1).replace('.',',');

/* ---------- FORMULÁRIO ---------- */
function montarForm(){
  document.getElementById('fArb').innerHTML='<option value="">Selecione</option>'+ARB.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
  document.getElementById('fData').valueAsDate=new Date();
  document.getElementById('blocos').innerHTML=BLOCOS.map((b,i)=>`
   <details class="bloco" ${i===0?'open':''}>
    <summary>${i+1}. ${b.nome}<span class="nb" id="nb_${b.id}">Nota –</span></summary>
    ${b.itens.map(([id,txt,p,esc,cg,dica])=>`
     <div class="item ${cg?'cg':''}">
      <div class="q"><span>${id} · ${txt}</span><span class="peso">Peso ${p}</span></div>
      ${dica?`<div class="dica">${dica}</div>`:''}
      <div class="ops" role="radiogroup" aria-label="${txt}">
       ${esc.ops.map(([l,v])=>`<label><input type="radio" name="q${id}" value="${v}" data-l="${l}"><span>${l}</span></label>`).join('')}
       ${esc.na?`<label><input type="radio" class="na" name="q${id}" value="na" data-l="${esc.na}"><span>${esc.na}</span></label>`:''}
      </div>
      <div class="min"><input id="pp${id}" placeholder="Pontos positivos (minutos)"><input id="pm${id}" placeholder="Pontos a melhorar (minutos)"></div>
     </div>`).join('')}
   </details>`).join('');
  document.getElementById('blocos').addEventListener('change',()=>{const r=lerResp();BLOCOS.forEach(b=>{const n=notaBloco(b,r);document.getElementById('nb_'+b.id).textContent='Nota '+fmt(n)})});
}
function lerResp(){const r={};BLOCOS.forEach(b=>b.itens.forEach(([id])=>{const el=document.querySelector(`input[name="q${id}"]:checked`);if(!el)return;
  r[id]=el.value==='na'?{na:true,l:el.dataset.l}:{v:+el.value,l:el.dataset.l};
  const pp=document.getElementById('pp'+id).value,pm=document.getElementById('pm'+id).value;if(pp)r[id].pp=pp;if(pm)r[id].pm=pm}));return r}
document.getElementById('btnEnviar').onclick=()=>{
  const erro=document.getElementById('erro');const arb=document.getElementById('fArb').value;const resp=lerResp();
  const falta=BLOCOS.flatMap(b=>b.itens.map(i=>i[0])).filter(id=>!resp[id]);
  if(!arb){erro.textContent='Selecione o árbitro avaliado.';return}
  if(falta.length){erro.textContent=`Faltam ${falta.length} itens sem resposta (ex.: item ${falta[0]}).`;
    const el=document.querySelector(`input[name="q${falta[0]}"]`);el.closest('details').open=true;el.closest('.item').scrollIntoView({behavior:'smooth',block:'center'});return}
  erro.textContent='';
  AVAL.push({arb,aval:document.getElementById('fAval').value,comp:document.getElementById('fComp').value,jogo:document.getElementById('fJogo').value||'Partida não informada',
    data:document.getElementById('fData').value,resp,resumo:fResumo.value,pos:fPos.value,mel:fMel.value});
  sv('fcf_aval',AVAL);limpar();document.getElementById('dArb').value=arb;trocar('dash');
};
function limpar(){document.querySelectorAll('#form input,#form textarea').forEach(e=>{if(e.type==='radio')e.checked=false;else if(e.type!=='date')e.value=''});
  BLOCOS.forEach(b=>document.getElementById('nb_'+b.id).textContent='Nota –');document.getElementById('erro').textContent=''}
document.getElementById('btnLimpar').onclick=limpar;

/* ---------- DASHBOARD ---------- */
let chart;
function filtradas(){const c=dComp.value,g=dGrupo.value,s=dSexo.value;
  return AVAL.filter(a=>{const p=ARB.find(x=>x.id===a.arb);return p&&(!c||a.comp===c)&&(!g||p.grupo===g)&&(!s||p.sexo===s)})}
function montarSelDash(){const g=dGrupo.value,s=dSexo.value,atual=dArb.value;
  const l=ARB.filter(a=>(!g||a.grupo===g)&&(!s||a.sexo===s));
  dArb.innerHTML=l.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
  if(l.some(a=>a.id===atual))dArb.value=atual}
function render(){
  const main=document.getElementById('dMain');const av=filtradas();const arb=ARB.find(a=>a.id===dArb.value);
  if(!arb){main.innerHTML='<div class="gl vazio">Nenhum árbitro com esses filtros.</div>';return}
  const minhas=av.filter(a=>a.arb===arb.id).sort((a,b)=>a.data<b.data?1:-1);
  const porArb={};av.forEach(a=>{(porArb[a.arb]=porArb[a.arb]||[]).push(notas(a).geral)});
  const ranking=Object.entries(porArb).map(([id,l])=>[id,med(l)]).sort((a,b)=>b[1]-a[1]);
  const pos=ranking.findIndex(r=>r[0]===arb.id)+1;
  const grupoAv=av.filter(a=>ARB.find(x=>x.id===a.arb).grupo===arb.grupo);
  const nbMeu=BLOCOS.map((_,i)=>med(minhas.map(a=>notas(a).nb[i])));
  const nbGrupo=BLOCOS.map((_,i)=>med(grupoAv.map(a=>notas(a).nb[i])));
  const geral=med(minhas.map(a=>notas(a).geral));const mGrupo=med(grupoAv.map(a=>notas(a).geral));
  const dist={Excelente:0,'Ótimo':0,Bom:0,Regular:0,Insuficiente:0};
  minhas.forEach(a=>Object.values(a.resp).forEach(r=>{if(r.l in dist)dist[r.l]++}));
  const val=nbMeu.map((n,i)=>[BLOCOS[i].nome,n]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  const ini=arb.nome.split(' ').filter(p=>p.length>2).map(p=>p[0]).slice(0,2).join('');
  const ult=minhas[0];
  main.innerHTML=`
  <div class="perfil">
    <button class="foto" id="btnFoto" aria-label="Trocar foto">${FOTOS[arb.id]?`<img src="${FOTOS[arb.id]}" alt="Foto de ${arb.nome}">`:ini}</button>
    <div class="col">
      <div class="barra">${arb.nome}</div>
      <div class="lar">${arb.cidade}</div>
      <div class="chips"><div class="lar">Grupo<br>${arb.grupo}</div><div class="lar">Idade<br>${arb.idade}</div><div class="lar" style="display:grid;place-items:center">${arb.sexo}</div></div>
      <div class="barra" style="font-size:20px">ÁRBITRO</div>
    </div>
    <div class="rank">Ranking<b>${pos?pos+'º':'–'}</b><span style="font-size:14px;color:#cdd6ff">de ${ranking.length}</span></div>
  </div>
  <div class="kpis">
    <div class="gl kpi"><div class="k">Avaliações</div><div class="v">${minhas.length}</div></div>
    <div class="gl kpi" style="border-color:var(--ouro);box-shadow:0 0 14px rgba(245,208,0,.45)"><div class="k">Nota geral</div><div class="v" style="color:var(--ok)">${fmt(geral)}</div></div>
    <div class="gl kpi"><div class="k">Média do grupo ${arb.grupo}</div><div class="v">${fmt(mGrupo)}</div></div>
  </div>
  <div class="baixo">
    <div class="gl radar"><canvas id="cRadar" aria-label="Radar das notas por bloco"></canvas></div>
    <div class="dir">
      <div class="gl dist"><div class="t">Distribuição de conceitos</div><div class="g">
        ${Object.entries(dist).map(([k,v])=>`<div><div class="k">${k==='Insuficiente'?'Insuf.':k}</div><div class="v">${v}</div></div>`).join('')}</div></div>
      <div class="gl dest"><div class="k">Melhor bloco</div><div class="v" style="color:var(--ok)">${val[0]?val[0][0]+' · '+fmt(val[0][1]):'–'}</div>
        <div class="k" style="margin-top:8px">Ponto de atenção</div><div class="v" style="color:var(--alerta)">${val.length?val[val.length-1][0]+' · '+fmt(val[val.length-1][1]):'–'}</div></div>
      <div class="gl dest" style="border-color:var(--neon);box-shadow:0 0 14px rgba(91,140,255,.55)"><div class="k">Última avaliação</div>
        <div style="font-size:18px">${ult?ult.jogo:'–'}</div><div class="v">${ult?fmt(notas(ult).geral):'–'}</div></div>
      ${ult?`<div class="gl coment"><h3>Comentários da última avaliação</h3>
        ${ult.resumo?`<p><b>Resumo:</b> ${esc(ult.resumo)}</p>`:''}${ult.pos?`<p><b>Positivos:</b> ${esc(ult.pos)}</p>`:''}${ult.mel?`<p><b>A melhorar:</b> ${esc(ult.mel)}</p>`:''}</div>`:''}
    </div>
  </div>`;
  document.getElementById('btnFoto').onclick=()=>upFoto.click();
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('cRadar'),{type:'radar',
    data:{labels:BLOCOS.map(b=>b.curto),datasets:[
      {label:'Árbitro',data:nbMeu,borderColor:'#f07a2c',backgroundColor:'rgba(240,122,44,.18)',pointBackgroundColor:'#f07a2c',borderWidth:3},
      {label:'Grupo '+arb.grupo,data:nbGrupo,borderColor:'#5bb8ff',backgroundColor:'rgba(91,184,255,.12)',pointBackgroundColor:'#5bb8ff',borderWidth:3}]},
    options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#fff',font:{size:15,family:'Barlow Condensed'}}},
      tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},
      scales:{r:{min:0,max:10,ticks:{display:false,stepSize:2},grid:{color:'#3a4a9a'},angleLines:{color:'#3a4a9a'},pointLabels:{color:'#fff',font:{size:15,family:'Barlow Condensed'}}}}}});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
upFoto.onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{
  const c=document.createElement('canvas');const w=300,h=Math.round(300*img.height/img.width);c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  FOTOS[dArb.value]=c.toDataURL('image/jpeg',.8);sv('fcf_fotos',FOTOS);render();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);upFoto.value=''};
['dComp'].forEach(id=>document.getElementById(id).onchange=render);
['dGrupo','dSexo'].forEach(id=>document.getElementById(id).onchange=()=>{montarSelDash();render()});
dArb.onchange=render;
btnReset.onclick=()=>{AVAL=exemplo();sv('fcf_aval',AVAL);render()};

/* ---------- NAVEGAÇÃO ---------- */
function trocar(t){document.querySelectorAll('.tela').forEach(s=>s.classList.toggle('ativa',s.id===t));
  document.querySelectorAll('.menu button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tela===t));
  if(t==='dash'){render()}window.scrollTo(0,0)}
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>trocar(b.dataset.tela));

montarForm();montarSelDash();
</script>
</body>
</html>
